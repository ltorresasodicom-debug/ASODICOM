# =============================================================================
# SIGEL — NGINX como reverse-proxy unificado (frontend + API)
# =============================================================================
upstream sigel_web      { server web:4000; }
upstream sigel_gateway  { server gateway:3000; }
upstream sigel_grafana  { server grafana:3000; }

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50M;
    proxy_buffering off;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Frontend Next.js
    location / {
        proxy_pass http://sigel_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://sigel_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger
    location /docs {
        proxy_pass http://sigel_gateway/api/docs;
    }

    # Grafana embebido en /metrics-ui
    location /metrics-ui/ {
        proxy_pass http://sigel_grafana/;
    }
}
