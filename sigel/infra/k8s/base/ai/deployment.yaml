apiVersion: apps/v1
kind: Deployment
metadata: { name: ai, namespace: sigel }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai } }
  template:
    metadata: { labels: { app: ai } }
    spec:
      containers:
        - name: ai
          image: ghcr.io/sigel-ec/ai:latest
          ports: [{ containerPort: 8001 }]
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits:   { cpu: 4000m, memory: 8Gi }
          readinessProbe: { httpGet: { path: /health, port: 8001 } }
