apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: sigel }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1 } }
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/sigel-ec/gateway:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 3000 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: DB_HOST, value: postgres }
            - { name: REDIS_HOST, value: redis }
            - { name: ANALYTICS_URL, value: http://analytics:8000 }
            - { name: AI_URL, value: http://ai:8001 }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: gateway-secret, key: jwt } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: user } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: password } }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 2Gi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 30
