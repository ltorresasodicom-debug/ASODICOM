[project]
name = "sigel-ai"
version = "1.0.0"
description = "SIGEL — Servicio de IA: NLP, OCR, clasificación de denuncias, sentimiento"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "spacy>=3.7.0",
    "transformers>=4.38.0",
    "torch>=2.2.0",
    "sentence-transformers>=2.5.0",
    "pdfplumber>=0.10.0",
    "pillow>=10.2.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "structlog>=24.1.0",
]
